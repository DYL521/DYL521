name: Rotate DeepSeek-chan

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      # plain git instead of actions/checkout: this repo only allows local actions
      - run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
        env:
          TOKEN: ${{ github.token }}
      - working-directory: repo
        run: |
          python3 scripts/rotate_hero.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.svg
          git diff --cached --quiet || git commit -m "Rotate DeepSeek-chan pose [skip ci]"
          git push
